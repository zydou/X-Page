compatibility_date = "2026-07-01"
main = "worker.js"
name = "x"
preview_urls = false

# Text module rules：把 .css 文件作为纯文本字符串导入 worker.js，
# 内联到最终 HTML 的 <style> 标签里，彻底消除外部引用，
# 让每条路由渲染的页面都完全自包含、不受混合内容拦截。
# ⚠️ 必须用 [[rules]] 数组表头形式，不能用裸 `rules = [{...}]`。
# 原因：当文件里同时有 [[r2_buckets]] 等其他 [[array]] 块时，
# 裸字段会被 TOML 解析器吞进最近的 [[array]] 项里，导致 Text rule 失效、
# CSS import 拿到空对象、HTML 渲染为 "[object Object]" 字符串。
# 见 CLAUDE.md "wrangler.toml module rules 坑" 记录。
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

# R2 bucket 绑定（生产）：tweets 与 wechat 共用同一桶 x-page
# key 前缀：
#   tweet/<id>.json        → fxtwitter thread JSON（未翻译）
#   tweet/<id>.<lang>.json → 带翻译的 thread JSON（?lang= 或 TRANSLATE_TO），每种语言一份
#   wechat/<原文URL>       → 渲染后的完整 HTML（wechat 路由，防原文删除后失效）
# lifecycle 规则（已通过 CLI 配置）：
#   tweet/ 前缀 365 天过期：
#     npx wrangler r2 bucket lifecycle add x-page expire-tweets-after-1y tweet/ --expire-days 365
#   wechat/ 前缀无过期规则，默认永久保留（防失效优先）
#   md/ 前缀（/html/ 与 /wechat/ 的 text/markdown 变体）同样永久保留：
#     转换本身零配额，但单篇 130-330ms、约 8% 有 48-100 秒长尾，
#     让每个 URL 一生只转换一次可以把重复请求的延迟从秒级压到毫秒级。
#     需要强刷新用 ?refresh= 重转。
[[r2_buckets]]
binding = "TWEETS"
bucket_name = "x-page"

# Workers AI 绑定：/html/ 与 /wechat/ 的 Accept: text/markdown 转换用它。
# toMarkdown 对 HTML 是纯确定性解析、不调用任何模型，因此消耗 0 Neuron，
# 完全不碰免费套餐 10,000 Neurons/天 的池子。详见 lib/to-markdown.js 头注。
[ai]
binding = "AI"

# Build: download & build remote assets (CSS, JS) before uploading.
# This lets `npx wrangler deploy` work out of the box after cloning,
[build]
command = "sh build.sh"

[vars]
TIMEZONE = "Asia/Shanghai"
TRANSLATE_TO = "zh-cn"
# User-Agent 覆盖：/html/ 路由抓取时的 UA。
# 默认使用 iOS 微信内置浏览器 UA，用于绕过微信公众号白名单。
UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 26_5_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 MicroMessenger/8.0.73(0x18004939) NetType/WIFI Language/zh_CN"
# GITHUB_TOKEN 以 Worker Secret 形式存储（wrangler secret put GITHUB_TOKEN），
# 不再以明文 var 形式保存。运行时仍通过 env.GITHUB_TOKEN 读取，代码无需改动。

# Enable logs
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1
